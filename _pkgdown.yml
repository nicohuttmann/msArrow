url: https://nicohuttmann.github.io/msArrow/

template:
  bootstrap: 5
  bslib:
    primary: "#18974C"
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

reference:

- title: Reading and writing data
  desc: >
    The core contract: a variable holds a *path*, not the data. `write_data()`
    returns the file it wrote, and every downstream step re-reads it. This is
    deliberate memory management for large MS data.
  contents:
  - write_data
  - get_data
  - open_data
  - get_data_m

- title: Looking at a file
  desc: >
    Read the first rows of something large without loading it. Both report how
    many rows the file actually holds, which costs nothing to look up.
  contents:
  - preview_data
  - view_data

- title: Temporary files
  desc: >
    `write_data()` without a file name writes into `tempdir()`. These list,
    measure and clear what accumulated there.
  contents:
  - starts_with("tempdir_")

- title: Nested lists on disk
  desc: >
    A list is written as a folder of files (`.parquetlist`) rather than one
    large `.Rds`, so single elements can be read without loading the rest.
  contents:
  - load_objects
  - .save_objects_recursively
  - .read_objects_recursively

- title: Utilities
  contents:
  - cleanMem
  - "%>%"
