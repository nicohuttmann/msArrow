url: https://nicohuttmann.github.io/msArrow/

template:
  bootstrap: 5
  bslib:
    primary: "#18974C"
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

reference:

- title: Reading and writing data
  desc: >
    The core contract: a variable holds a *path*, not the data. `write_data()`
    returns the file it wrote, and every downstream step re-reads it. This is
    deliberate memory management for large MS data.
  contents:
  - write_data
  - get_data
  - open_data
  - get_data_m

- title: Looking at a file
  desc: >
    Read the first rows of something large without loading it. Both report how
    many rows the file actually holds, which costs nothing to look up.
  contents:
  - preview_data
  - view_data

- title: Temporary files
  desc: >
    `write_data()` without a file name writes into `tempdir()`. These list,
    measure and clear what accumulated there.
  contents:
  - starts_with("tempdir_")

- title: Nested lists on disk
  desc: >
    A list is written as a folder of files (`.parquetlist`) rather than one
    large `.Rds`, so single elements can be read without loading the rest.
  contents:
  - load_objects
  - .save_objects_recursively
  - .read_objects_recursively

- title: Datasets
  desc: >
    The dataset store. A dataset is a folder holding variables, observations
    and any number of long `observations x variables` data frames. The registry
    lives in two objects in the global environment: `.Datasets` (paths) and
    `Datasets` (previews).
  contents:
  - get_dataset
  - get_dataset_names
  - .add_dataset
  - retag_datasets

- title: Variables
  desc: Per-variable annotation (precursors, peptides, protein groups).
  contents:
  - get_variables
  - get_variables_data
  - get_variables_data_names
  - add_variables_data
  - save_variables_data
  - .save_variables_data

- title: Observations
  desc: Per-observation annotation (runs, samples, conditions).
  contents:
  - get_observations
  - get_observations_data
  - get_observations_data_names
  - add_observations_data
  - save_observations_data
  - .save_observations_data

- title: Data frames
  desc: The measured values themselves, stored long and read back on demand.
  contents:
  - get_data_frame
  - get_data_frame_names
  - open_data_frame
  - save_data_frame
  - .save_data_frame

- title: Importing DIA-NN reports
  desc: >
    Turn a DIA-NN report straight into a dataset store, without ever holding
    the whole report in memory.
  contents:
  - import_diann
  - import_diann_channel
  - check_report
  - .add_defaults
  - .get_defaults

- title: String helpers
  desc: Splitting and locating inside identifiers such as `P12345_SEQ_1_20`.
  contents:
  - starts_with("strsplit_")
  - str_rev
  - str_locate_last

- title: Small tools
  desc: Short helpers used constantly in analysis code.
  contents:
  - cc
  - fu
  - fus
  - cleanMem
  - cleanup
  - "%>%"

- title: Code-writing helpers
  desc: >
    Print pasteable code snippets to the console. The `.cat_get_*` writers are
    interactive and prompt for a dataset and columns.
  contents:
  - starts_with(".cat_")
